services:
  db:
    image: postgres:16-alpine
    env_file:
      - secrets.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: checker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    env_file:
      - secrets.env
    environment:
      CHECKER_DB_HOST: db
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
